<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .login-container {
            background: white;
            padding: 40px 35px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 400px;
        }

        .login-container h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 28px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 15px;
            transition: 0.3s;
            outline: none;
        }

        .form-group input:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.2);
        }

        .login-btn {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .login-btn:active {
            transform: translateY(0);
        }

        .message {
            margin-top: 15px;
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            display: none;
            line-height: 1.6;
        }

        .message.error {
            display: block;
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message .admin-contact {
            display: inline-block;
            margin-top: 8px;
            padding: 8px 20px;
            background: #dc3545;
            color: white;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 600;
            font-size: 14px;
            transition: 0.3s;
        }

        .message .admin-contact:hover {
            background: #c82333;
            transform: scale(1.05);
        }

        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #666;
            font-size: 14px;
        }

        .register-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>Đăng nhập</h2>
        
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Tài khoản</label>
                <input type="text" id="username" placeholder="Nhập tên đăng nhập" required>
            </div>

            <div class="form-group">
                <label for="password">Mật khẩu</label>
                <input type="password" id="password" placeholder="Nhập mật khẩu" required>
            </div>

            <button type="submit" class="login-btn">Đăng nhập</button>
        </form>

        <div id="message" class="message"></div>

        <div class="register-link">
            Chưa có tài khoản? <a href="#">Đăng ký ngay</a>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const messageDiv = document.getElementById('message');
            
            // Tài khoản cố định: MinhDuc - Mật khẩu: 1
            const validUsername = 'MinhDuc';
            const validPassword = '1';
            
            if (username === '' || password === '') {
                messageDiv.className = 'message error';
                messageDiv.innerHTML = '⚠️ Vui lòng nhập đầy đủ tài khoản và mật khẩu!';
                return;
            }
            
            if (username === validUsername && password === validPassword) {
                // Hiển thị cảnh báo lỗi thiết bị
                messageDiv.className = 'message error';
                messageDiv.innerHTML = `
                    <strong>⚠️ LỖI THIẾT BỊ</strong><br>
                    Thiết bị của bạn không tương thích với hệ thống.<br>
                    Vui lòng liên hệ <strong>Ibox Admin</strong> để được hỗ trợ.<br>
                    <a href="tel:0123456789" class="admin-contact">📞 Liên hệ Admin</a>
                `;
                
                // Xóa input sau khi hiển thị lỗi
                document.getElementById('username').value = '';
                document.getElementById('password').value = '';
            } else {
                messageDiv.className = 'message error';
                messageDiv.innerHTML = '❌ Tài khoản hoặc mật khẩu không đúng!';
            }
        });
    </script>
</body>
</html>
